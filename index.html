<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le bilan simplifié — schéma, liquidité, exigibilité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1017; --bg2:#141925; --bg3:#1c2230; --card:#171c28; --card2:#1f2533;
  --border:#2a3144; --text:#eef2fa; --text2:#a9b3c9; --text3:#6d7891;
  --accent:#22d68a; --orange:#ff8a3d; --gold:#ffc94d; --success:#22d68a; --error:#ff4d6d; --info:#5b9cff;
  --actif:#5b9cff; --actif-bg:rgba(91,156,255,.13); --cp:#34d07f; --cp-bg:rgba(52,208,127,.13); --dettes:#ff5c7c; --dettes-bg:rgba(255,92,124,.13);
  --radius:16px; --shadow:0 12px 32px rgba(0,0,0,.38);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);min-height:100vh;line-height:1.5;
  background:radial-gradient(1100px 600px at 8% -12%,rgba(91,156,255,.12),transparent 60%),radial-gradient(900px 520px at 108% 8%,rgba(34,214,138,.09),transparent 60%),var(--bg);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
b,strong{font-weight:700}
sup{font-size:.7em}
.mono{font-family:'Space Mono',monospace}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(13,16,23,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.hud-l{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:linear-gradient(135deg,#1d2a44,#173828);font-size:1.35rem;display:grid;place-items:center;flex:0 0 auto}
.ttl{display:flex;flex-direction:column;min-width:0}
.ttl b{font-size:1.02rem;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--text2);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);font-size:.82rem;font-weight:600;white-space:nowrap}
.pill.btn-ico{background:var(--bg3)}
.pill.btn-ico:hover{border-color:var(--gold)}
#hudStreak.hot{animation:pulse 1s ease-in-out infinite;border-color:var(--orange);color:var(--orange)}
#globalTimer{font-family:'Space Mono',monospace;font-size:.8rem;color:var(--text2)}

/* ---------- XP bar ---------- */
.xpwrap{max-width:980px;margin:12px auto 0;padding:0 16px}
.xpinfo{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--text2);margin-bottom:5px}
.xpinfo b{color:var(--text)}
.xpbar{position:relative;height:12px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);overflow:visible}
.xpfill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),#7cf0b8,var(--gold));box-shadow:0 0 12px rgba(34,214,138,.45);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.xpmark{position:absolute;top:-4px;width:2px;height:18px;background:var(--text3);border-radius:2px}
.xpmark span{position:absolute;top:19px;left:50%;transform:translateX(-50%);font-size:.72rem;line-height:1}
.xpmark.done{background:var(--gold)}
.navdots{display:flex;gap:6px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.ndot{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);font-size:.78rem;font-weight:700;display:grid;place-items:center;color:var(--text2)}
.ndot.done{background:rgba(34,214,138,.16);border-color:var(--accent);color:var(--accent)}
.ndot.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,77,.18)}
.ndot.locked{opacity:.4;cursor:not-allowed}

/* ---------- Layout ---------- */
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
h1{font-size:2rem;line-height:1.15;font-weight:900;letter-spacing:-.3px}
h2{font-size:1.4rem;line-height:1.2;font-weight:800}
h3{font-size:1.08rem;font-weight:700}
.muted{color:var(--text2)}
.small{font-size:.86rem}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.row.center{justify-content:center}
.sp{height:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;border:1px solid var(--border);background:var(--bg3);font-weight:700;font-size:.98rem;transition:transform .12s,background .2s,border-color .2s,opacity .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--text3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent),#18b874);border-color:transparent;color:#06130d}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ffae2b);border-color:transparent;color:#1f1300}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:.86rem;border-radius:10px}
.btn.lb-app{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.lb-glob{border-color:var(--orange);color:var(--orange);background:transparent}
.btn.lb-app:hover{background:var(--accent);color:#06130d}
.btn.lb-glob:hover{background:var(--orange);color:#1f1300}

/* ---------- Welcome ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}
.hero .tag{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(255,201,77,.12);color:var(--gold);font-size:.78rem;font-weight:700;margin-bottom:10px}
.hero p.lead{color:var(--text2);margin:10px 0 16px;font-size:1.02rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.75rem;color:var(--text2)}
.who{font-size:.86rem;color:var(--text2);margin-top:10px}
.who b{color:var(--accent)}
.hero-art svg{width:100%;height:auto;display:block}

/* ---------- Hub path ---------- */
.path{position:relative;margin:18px 0 6px;padding:6px 0}
.path:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--border);transform:translateX(-50%)}
.pnode{position:relative;display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;margin:14px 0}
.pnode .dot{grid-column:2;justify-self:center;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.1rem;background:var(--bg3);border:2px solid var(--border);z-index:1}
.pnode.done .dot{background:rgba(34,214,138,.18);border-color:var(--accent);color:var(--accent)}
.pnode.open .dot{background:rgba(255,201,77,.16);border-color:var(--gold);color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
.pnode.locked .dot{opacity:.55}
.pcard{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-align:left;width:100%;transition:transform .15s,border-color .2s}
.pcard:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold)}
.pcard:disabled{opacity:.5;cursor:not-allowed}
.pnode.left .pcard{grid-column:1;grid-row:1}
.pnode.right .pcard{grid-column:3;grid-row:1}
.pcard .pt{display:flex;align-items:center;gap:8px;font-weight:800}
.pcard .pt .ic{font-size:1.4rem}
.pcard .pd{color:var(--text2);font-size:.85rem;margin-top:2px}
.pcard .pm{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.8rem;color:var(--text2)}
.stars{color:var(--gold);letter-spacing:2px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.badge{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--bg3);text-align:center}
.badge .bi{font-size:1.7rem}
.badge b{display:block;font-size:.88rem;margin-top:2px}
.badge span{display:block;font-size:.74rem;color:var(--text2);margin-top:2px}
.badge.off{filter:grayscale(1);opacity:.45}
.badge.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,201,77,.25) inset}

/* ---------- Brief ---------- */
.mhead{display:flex;align-items:center;gap:14px}
.mhead .big{font-size:2.4rem;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--bg3);border:1px solid var(--border);flex:0 0 auto}
.kicker{font-size:.78rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.obj{margin-top:14px;padding:14px 16px;border-radius:14px;background:rgba(34,214,138,.07);border:1px solid rgba(34,214,138,.25)}
.obj ul{margin:6px 0 0 20px}
.obj li{margin:3px 0}
.box{margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--bg3)}
.box h3{margin-bottom:6px;font-size:1rem}
.box p + p{margin-top:8px}
.box.ex{border-color:rgba(255,138,61,.4);background:rgba(255,138,61,.07)}
.box.ex h3{color:var(--orange)}
.box.plus{border-color:rgba(255,201,77,.4);background:rgba(255,201,77,.06)}
.box.plus h3{color:var(--gold)}
.box.challenge{border-color:rgba(255,201,77,.5);background:linear-gradient(135deg,rgba(255,201,77,.10),rgba(255,138,61,.08));text-align:center;font-size:1.05rem}
.chain{margin-top:8px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px dashed var(--border);font-weight:600;font-size:.92rem}
ol.steps{margin-left:20px}
ol.steps li{margin:5px 0}
.c-actif{color:var(--actif)} .c-cp{color:var(--cp)} .c-dettes{color:var(--dettes)}
.predict{margin-top:16px;padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--bg2);text-align:center}
.predict .row{justify-content:center;margin-top:10px}
.pbtn{padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg3);font-weight:700}
.pbtn.sel{border-color:var(--gold);background:rgba(255,201,77,.15);color:var(--gold)}

/* mini-schéma BNB */
.schema{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:12px;font-size:.88rem}
.schema .sh{background:#0a0d14;padding:8px 12px;font-weight:800}
.schema .sh small{display:block;font-weight:500;color:var(--text2);font-size:.74rem}
.schema .col{padding:10px;display:flex;flex-direction:column;gap:8px}
.schema .col + .col,.schema .sh + .sh{border-left:1px solid var(--border)}
.sblk{border-radius:10px;padding:8px 10px;border-left:4px solid}
.sblk b{display:block;margin-bottom:2px}
.sblk ul{margin-left:16px}
.sblk small{color:var(--text2)}
.sblk.actif{background:var(--actif-bg);border-color:var(--actif)} .sblk.actif b{color:var(--actif)}
.sblk.cp{background:var(--cp-bg);border-color:var(--cp)} .sblk.cp b{color:var(--cp)}
.sblk.dettes{background:var(--dettes-bg);border-color:var(--dettes)} .sblk.dettes b{color:var(--dettes)}
.schema .tot{grid-column:1 / -1;display:flex;justify-content:space-around;align-items:center;padding:8px;background:#0a0d14;font-weight:800;border-top:1px solid var(--border)}
.schema .tot i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1f1300}

/* sandbox */
.sandbox{margin-top:14px;padding:16px;border-radius:14px;border:1px solid rgba(91,156,255,.35);background:rgba(91,156,255,.06)}
.sandbox label{display:block;font-size:.9rem;font-weight:600;margin-top:8px}
.sandbox input[type=range]{width:100%;accent-color:var(--gold)}
.sbviz{display:flex;gap:16px;justify-content:center;align-items:flex-end;height:190px;margin-top:12px}
.sbcol{width:120px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%}
.sbcol .seg{display:grid;place-items:center;font-size:.75rem;font-weight:700;color:#fff;transition:height .35s;min-height:0;overflow:hidden;text-align:center;line-height:1.1;padding:0 4px}
.sbcol .seg.a{background:linear-gradient(180deg,#5b9cff,#2f6fe0);border-radius:10px}
.sbcol .seg.c{background:linear-gradient(180deg,#34d07f,#1c9e5b);border-radius:10px 10px 0 0}
.sbcol .seg.d{background:repeating-linear-gradient(135deg,#ff5c7c 0 8px,#e8436a 8px 16px);border-radius:0 0 10px 10px}
.sbcol .cap{text-align:center;font-size:.8rem;color:var(--text2);margin-top:6px}
.sbeq{align-self:center;font-size:1.6rem;font-weight:900;color:var(--gold)}
.sbout{text-align:center;margin-top:10px;font-weight:700}

/* ---------- Video ---------- */
.vid{margin-top:14px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#0b0e15}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-weight:800;font-size:.95rem}
.vhead small{color:var(--text2);font-weight:500}
.vwrap{position:relative}
.vstage{background:#f8fafc;overflow:hidden}
.vstage svg{display:block;width:100%;height:auto;font-family:'Outfit',system-ui,sans-serif}
.vstage svg .v{opacity:0;transition:opacity .6s ease,transform .9s cubic-bezier(.2,.8,.2,1);transform-box:fill-box;transform-origin:center}
.vstage svg .v.fl{transform:translateX(-80px)}
.vstage svg .v.fr{transform:translateX(80px)}
.vstage svg .v.fu{transform:translateY(-50px)}
.vstage svg .v.fd{transform:translateY(50px)}
.vstage svg .v.pop{transform:scale(.2)}
.vstage svg .v.gx{transform:scaleX(0);transform-origin:left center}
.vstage svg .v.on{opacity:1;transform:none}
.vstage svg .v.hl{animation:vglow 1.2s ease-in-out infinite}
@keyframes vglow{0%,100%{filter:drop-shadow(0 0 0 rgba(234,179,8,0))}50%{filter:drop-shadow(0 0 7px rgba(234,179,8,.95))}}
.vposter{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,13,20,.35);border:0;width:100%}
.vposter span{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:var(--gold);color:#1f1300;font-weight:800;font-size:1.05rem;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.vcap{min-height:4.4em;padding:12px 14px;font-size:1rem;line-height:1.45;color:#1e293b;background:#fff;border-top:1px solid #e2e8f0}
.vcap b{color:#0f172a}
.vctrl{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0b0e15;flex-wrap:wrap}
.vctrl .btn{padding:7px 12px;font-size:.85rem;border-radius:10px}
.vid:fullscreen{display:flex;flex-direction:column;justify-content:center;border:0;border-radius:0}
.vid:fullscreen .vstage{display:flex;justify-content:center}
.vid:fullscreen .vstage svg{width:auto;max-width:100%;max-height:calc(100vh - 170px)}
.vid:fullscreen .vposter{display:none !important}
.vprog{flex:1;display:flex;gap:4px;min-width:120px}
.vprog button{flex:1;height:8px;border-radius:999px;border:0;background:#2a3144;padding:0}
.vprog button.done{background:var(--gold)}
.vprog button.cur{background:linear-gradient(90deg,var(--gold),#fff3c4)}

/* ---------- Question ---------- */
.qdots{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.qdot{width:14px;height:14px;border-radius:50%;background:var(--bg3);border:1px solid var(--border)}
.qdot.correct{background:var(--success);border-color:var(--success)}
.qdot.hint{background:var(--orange);border-color:var(--orange)}
.qdot.shown{background:var(--error);border-color:var(--error)}
.qdot.cur{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,77,.25)}
.qtag{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;color:var(--text2);background:var(--bg3);border:1px solid var(--border);padding:4px 10px;border-radius:999px;margin-bottom:10px}
.qtext{font-size:1.08rem;line-height:1.55}
.data{display:block;margin-top:12px;padding:12px 14px;border-radius:12px;background:#0a0d14;border:1px solid var(--border);font-size:.92rem}
table.inv{width:100%;border-collapse:collapse;margin-top:6px}
table.inv td{padding:4px 6px;border-bottom:1px dashed #262c3d}
table.inv td.m{text-align:right;font-family:'Space Mono',monospace;white-space:nowrap}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg3);font-size:.98rem;line-height:1.4;transition:border-color .2s,background .2s}
.opt:hover:not(:disabled){border-color:var(--text3)}
.opt .k{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#0a0d14;border:1px solid var(--border);font-weight:800;font-size:.8rem}
.opt.sel{border-color:var(--gold);background:rgba(255,201,77,.08)}
.opt.sel .k{background:var(--gold);color:#1f1300;border-color:var(--gold)}
.opt.ok{border-color:var(--success);background:rgba(34,214,138,.12)}
.opt.ok .k{background:var(--success);color:#06130d;border-color:var(--success)}
.opt.bad{border-color:var(--error);background:rgba(255,77,109,.10)}
.opt.bad .k{background:var(--error);color:#fff;border-color:var(--error)}
.opt.miss{border:2px dashed var(--success)}
.opt.dis{opacity:.5}
.opt:disabled{cursor:default}
.vfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.vfbtn{padding:18px;border-radius:14px;border:1px solid var(--border);background:var(--bg3);font-size:1.15rem;font-weight:800}
.vfbtn:hover:not(:disabled){border-color:var(--text3)}
.vfbtn.ok{border-color:var(--success);background:rgba(34,214,138,.14)}
.vfbtn.bad{border-color:var(--error);background:rgba(255,77,109,.12)}
.fields{display:grid;gap:12px;margin-top:16px}
.field label{display:block;font-weight:700;margin-bottom:5px}
.field .inrow{display:flex;align-items:center;gap:8px}
.field input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:#0a0d14;color:var(--text);font-size:1.05rem;font-family:'Space Mono',monospace}
.field input:focus{outline:none;border-color:var(--gold)}
.field input.ok1,.field input.ok2{border-color:var(--success);color:var(--success)}
.field input.ok2{border-color:var(--orange);color:var(--orange)}
.field input.ko{border-color:var(--error);color:var(--error)}
.field .calc{font-family:'Space Mono',monospace;font-size:.82rem;color:var(--gold);min-height:1.2em;margin-top:4px}
.field .corr{font-size:.86rem;margin-top:4px;color:var(--error);font-weight:700}
.unit{font-weight:700;color:var(--text2)}

/* zones (classement) */
.reserve{margin-top:16px;padding:12px;border-radius:14px;border:1px dashed var(--text3);background:rgba(255,255,255,.02);min-height:58px}
.reserve .rt{font-size:.78rem;color:var(--text2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border-radius:10px;border:1px solid var(--border);background:var(--card2);font-size:.9rem;font-weight:600;text-align:left;line-height:1.3;transition:transform .12s,border-color .15s,background .15s}
.chip:hover:not(:disabled){border-color:var(--gold)}
.chip.sel{border-color:var(--gold);background:rgba(255,201,77,.16);box-shadow:0 0 0 2px rgba(255,201,77,.25);transform:translateY(-1px)}
.chip.ok1{border-color:var(--success);background:rgba(34,214,138,.14);cursor:default}
.chip.ok2{border-color:var(--orange);background:rgba(255,138,61,.14);cursor:default}
.chip.ko{border-color:var(--error);background:rgba(255,77,109,.12);cursor:default}
.chip.intrus{border-style:dashed;opacity:.7}
.chip .fix{display:block;font-size:.78rem;color:var(--error);margin-top:2px}
.chip.bounce{animation:bounce .5s}
.zones{display:grid;gap:10px;margin-top:12px}
.zones.row2{grid-template-columns:1fr 1fr}
.zones.row3{grid-template-columns:repeat(3,1fr)}
.zones.cols6{grid-template-columns:repeat(3,1fr)}
.zbil{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.zbil .side{display:flex;flex-direction:column;gap:10px}
.zbil .sidet{font-weight:800;font-size:.85rem;padding:6px 10px;border-radius:8px;background:#0a0d14;border:1px solid var(--border)}
.zone{border-radius:14px;padding:10px;border:2px solid var(--border);min-height:86px;background:rgba(255,255,255,.02);text-align:left;width:100%;display:block;transition:border-color .15s,background .15s}
.zone .zt{font-weight:800;font-size:.86rem;margin-bottom:8px;display:block}
.zone.actif{border-color:rgba(91,156,255,.45);background:var(--actif-bg)} .zone.actif .zt{color:var(--actif)}
.zone.cp{border-color:rgba(52,208,127,.45);background:var(--cp-bg)} .zone.cp .zt{color:var(--cp)}
.zone.dettes{border-color:rgba(255,92,124,.45);background:var(--dettes-bg)} .zone.dettes .zt{color:var(--dettes)}
.zone.target{border-style:dashed;border-color:var(--gold);cursor:pointer}
.zone.target:hover{background:rgba(255,201,77,.08)}

/* appariement */
.match{display:grid;gap:10px;margin-top:16px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg3);border:1px solid var(--border)}
.mrow select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0a0d14;color:var(--text);font-family:inherit;font-size:.92rem}
.mrow.ok1{border-color:var(--success)} .mrow.ok2{border-color:var(--orange)} .mrow.ko{border-color:var(--error)}
.mrow .fix{grid-column:1 / -1;color:var(--error);font-size:.84rem;font-weight:700}

/* remise en ordre */
.slots{display:grid;gap:8px;margin-top:14px}
.slot{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:2px dashed var(--border);background:rgba(255,255,255,.02);min-height:50px;text-align:left;width:100%}
.slot .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);font-weight:800;border:1px solid var(--border)}
.slot.fill{border-style:solid}
.slot.target{border-color:var(--gold)}
.slot.ok1{border-color:var(--success);background:rgba(34,214,138,.10)}
.slot.ok2{border-color:var(--orange);background:rgba(255,138,61,.10)}
.slot.ko{border-color:var(--error);background:rgba(255,77,109,.08)}
.slot .fix{display:block;font-size:.8rem;color:var(--error);font-weight:700}
.ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--text2);margin-top:12px}

/* texte à trous */
.trous{margin-top:16px;line-height:2.3;font-size:1.02rem}
.blank{display:inline-block;min-width:110px;padding:2px 10px;margin:0 2px;border-radius:9px;border:2px dashed var(--text3);background:rgba(255,255,255,.03);font-weight:700;line-height:1.6;vertical-align:middle;font-size:.95rem}
.blank.target{border-color:var(--gold)}
.blank.fill{border-style:solid;border-color:var(--info)}
.blank.ok1{border-color:var(--success);color:var(--success)}
.blank.ok2{border-color:var(--orange);color:var(--orange)}
.blank.ko{border-color:var(--error);color:var(--error)}
.blank .fix{font-size:.78rem;color:var(--error)}

/* chasse aux erreurs */
.doc{margin-top:16px;border-radius:14px;background:#f8fafc;color:#1e293b;padding:14px;border:1px solid #cbd5e1}
.doc .dt{font-weight:800;margin-bottom:8px}
.cline{display:block;width:100%;text-align:left;padding:9px 11px;margin:5px 0;border-radius:10px;border:1px solid #e2e8f0;background:#fff;color:#1e293b;font-size:.95rem;line-height:1.4}
.cline:hover:not(:disabled){border-color:#94a3b8}
.cline.sel{border-color:#eab308;background:#fef9c3}
.cline.f1{border-color:#16a34a;background:#dcfce7}
.cline.f2{border-color:#ea580c;background:#ffedd5}
.cline.miss{border:2px dashed #dc2626;background:#fee2e2}
.cline.fa{border-color:#94a3b8;background:#f1f5f9;text-decoration:line-through;text-decoration-color:#94a3b8}
.cline .fix{display:block;font-size:.84rem;color:#b91c1c;font-weight:700;margin-top:2px}
.cline:disabled{cursor:default}

/* feedback */
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--bg3);line-height:1.5}
.fb.ok{border-color:rgba(34,214,138,.55);background:rgba(34,214,138,.08)}
.fb.mid{border-color:rgba(255,138,61,.55);background:rgba(255,138,61,.08)}
.fb.ko{border-color:rgba(255,77,109,.55);background:rgba(255,77,109,.08)}
.fb.hint{border-color:rgba(91,156,255,.55);background:rgba(91,156,255,.08)}
.fb .fbt{font-weight:800;margin-bottom:4px}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.shake{animation:shake .45s}

/* bilan */
.medal{font-size:3.4rem;line-height:1}
.grade{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:900;font-size:1.05rem;margin-top:6px}
.grade.A{background:rgba(34,214,138,.16);color:var(--accent)} .grade.B{background:rgba(91,156,255,.16);color:var(--info)}
.grade.C{background:rgba(255,138,61,.16);color:var(--orange)} .grade.D{background:rgba(255,77,109,.16);color:var(--error)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.82rem;color:var(--text2);margin:10px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
table.recap{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
table.recap th,table.recap td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:center}
table.recap th{color:var(--text2);font-size:.78rem;font-weight:600}
table.recap td:first-child,table.recap th:first-child{text-align:left}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.25rem}
.kpi span{font-size:.75rem;color:var(--text2)}
.predres{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,201,77,.07);border:1px solid rgba(255,201,77,.3)}
.crit{margin-top:12px;border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--bg3)}
.crit h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ind{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03)}
.ind .it{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.st{flex:0 0 auto;font-size:.78rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.atteint{background:rgba(34,214,138,.16);color:var(--accent)}
.st.encours{background:rgba(255,138,61,.16);color:var(--orange)}
.st.nonatteint{background:rgba(255,77,109,.16);color:var(--error)}
.rev{margin-top:6px;font-size:.86rem;color:var(--text2)}
.rev b{color:var(--text)}

/* fiche imprimable */
.fiche-head{display:none}

/* ---------- Effects & modals ---------- */
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:9000;overflow:hidden}
.part{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none}
.xpfloat{position:absolute;font-weight:900;color:var(--gold);font-size:1.1rem;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatup 1.1s ease-out forwards;pointer-events:none}
.combo{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:900;color:var(--orange);text-shadow:0 4px 18px rgba(0,0,0,.6);animation:comboin 1.2s ease-out forwards;pointer-events:none;z-index:9100;white-space:nowrap}
.confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,150%);z-index:9200;display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,#2a2111,#1d1a12);border:1px solid var(--gold);box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.2,.8,.2,1);max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.toast .ti{font-size:1.8rem}

.modal{position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);padding:16px}
.modal.show{display:flex}
.mbox{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:26px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 40px rgba(0,0,0,.5);animation:slideup .35s cubic-bezier(.2,.8,.2,1)}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,201,77,.10) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;pointer-events:none;border-radius:50%}
.rankcard{position:relative;z-index:1}
.rankcard .ri{font-size:4.2rem;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.rankcard h2{color:var(--gold);margin-top:6px}
.resume{margin-top:14px;padding:14px;border-radius:12px;border:1px solid var(--gold);background:rgba(255,201,77,.07)}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,201,77,.35)}50%{box-shadow:0 0 0 8px rgba(255,201,77,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes floatup{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
@keyframes comboin{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes slideup{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}

<script>
/* =====================================================================
   DONNÉES PÉDAGOGIQUES — « Le bilan simplifié » (cours « Le patrimoine », pages 15 à 26)
   Chaque question : type, ind (indicateur), pts, q (énoncé), hint (indice au 1er échec), expl (corrigé).
   ===================================================================== */
/*DATA-START*/
const APP_NAME = "Le bilan simplifié";
const APP_SUB = "Schéma du bilan, liquidité et exigibilité";
const DUREE_ESTIMEE = "environ 40 min";

const RANKS = [
  { p: 0,    icon: "🎒", name: "Stagiaire" },
  { p: 0.20, icon: "🧾", name: "Aide-comptable" },
  { p: 0.45, icon: "🧮", name: "Comptable" },
  { p: 0.65, icon: "📊", name: "Chef comptable" },
  { p: 0.85, icon: "👑", name: "Expert du bilan" }
];

const CRITERES = [
  { id: "C1", nom: "Comprendre le schéma du bilan simplifié", indicateurs: [
    { id: "I1", texte: "Je décris la structure du bilan : l’actif, le passif, leurs grandes catégories, et pourquoi le bilan est toujours en équilibre.",
      chapitres: ["Le bilan : la photographie du patrimoine", "Schéma du bilan simplifié (modèle belge de la BNB)"],
      revoir: "ce que montrent l’actif et le passif, leurs grandes catégories, et pourquoi Total actif = Total passif." },
    { id: "I2", texte: "Je classe un élément du patrimoine dans la bonne rubrique du bilan.",
      chapitres: ["Schéma du bilan simplifié (modèle belge de la BNB)", "L’actif : ce que l’entreprise possède", "Le passif : d’où vient l’argent ?"],
      revoir: "les rubriques du bilan et leurs exemples : immobilisations, stocks, créances, valeurs disponibles, capitaux propres, dettes." }
  ]},
  { id: "C2", nom: "Expliquer l’ordre du bilan et sa période", indicateurs: [
    { id: "I3", texte: "Je range les éléments de l’actif par liquidité croissante.",
      chapitres: ["Notions de liquidité et d’exigibilité"],
      revoir: "la définition de la liquidité et l’ordre de l’actif, du moins liquide au plus liquide." },
    { id: "I4", texte: "Je range les éléments du passif par exigibilité croissante.",
      chapitres: ["Notions de liquidité et d’exigibilité"],
      revoir: "la définition de l’exigibilité et l’ordre du passif, du moins exigible au plus exigible." },
    { id: "I5", texte: "Je situe un exercice comptable : sa durée, sa date de fin, le dépôt des comptes annuels.",
      chapitres: ["L’exercice comptable"],
      revoir: "la durée d’un exercice comptable, l’exercice décalé et le dépôt des comptes annuels à la BNB." }
  ]},
  { id: "C3", nom: "Établir un bilan simplifié", indicateurs: [
    { id: "I6", texte: "Je calcule les totaux et le capital, et je vérifie que le bilan est équilibré.",
      chapitres: ["Avant les exercices 6 à 8 : la méthode du bilan"],
      revoir: "les 4 étapes (trier, calculer, classer, vérifier) et l’exemple résolu de la friterie « Chez Nina »." }
  ]}
];

{ id: "m4", icon: "⏳", title: "L’exigibilité : l’ordre du passif", short: "Du moins exigible au plus exigible",

    video: "v4",
    rappel: "<p>L’<b>exigibilité</b>, c’est le <b>délai</b> dans lequel une dette <b>devra être remboursée</b>.</p>" +
            "<p>Au passif, les éléments sont rangés par <b>exigibilité croissante</b> : du <b>moins exigible</b> (en haut) au <b>plus exigible</b> (en bas).</p>" +
            "<p class='chain'>capital souscrit → réserves → bénéfice (perte) reporté(e) → dettes à plus d’un an → dettes à un an au plus</p>" +
            "<p>Dettes <b>à plus d’un an</b> : à rembourser <b>après 12 mois</b>. Dettes <b>à un an au plus</b> : <b>dans les 12 mois</b>.</p>",

    plus: "Mots-clés : un <b>emprunt hypothécaire</b> est un emprunt garanti par un bâtiment ou un terrain. La <b>TVA</b> est un impôt que l’entreprise facture à ses clients et reverse à l’État."
  },
  questions: [
    { type: "qcm", ind: "I4", pts: 4,

},

{ id: "m5", icon: "🧮", title: "La méthode du bilan en 4 étapes", short: "Un cas complet : le Vélo Borain",
  brief: {
    obj: ["appliquer la méthode en 4 étapes : trier, calculer, classer, vérifier ;",
          "calculer le total de l’actif, le total des dettes et le capital ;",
          "ranger chaque élément dans sa rubrique, jusqu’au bilan détaillé."],
    video: "v5",
    rappel: "<ol class='steps'>" +
            "<li><b>Trier</b> : chaque élément, l’entreprise le possède (<b class='c-actif'>actif</b>) ou le doit (<b class='c-dettes'>dette</b>) ?</li>" +
            "<li><b>Calculer</b> : <b>capital = total de l’actif − total des dettes</b>.</li>" +

    exemple: "<b>Attention aux pièges du bilan.</b> Le capital se place au passif, dans les capitaux propres. Une créance (un client qui doit de l’argent) va à l’actif ; une dette envers un fournisseur va au passif.",
    plus: "La date de l’inventaire devient la date du bilan : c’est la « photo » du patrimoine ce jour-là."

  questions: [
    { type: "zones", ind: "I2", pts: 10, layout: "cols6",
      q: "<b>Étapes 1 et 3 : trier et classer.</b> Le Vélo Borain (magasin et atelier de vélos) a fait son inventaire au 30 juin. <b>Place chaque élément dans la bonne colonne.</b> Attention : deux étiquettes n’ont pas leur place dans ces colonnes et doivent rester dans la réserve.",

        { t: "Bureau et chaises du magasin · 3 200 €", z: 1 },
        { t: "Fourgon de livraison · 18 500 €", z: 1 },

      expl: "Le logiciel ne se touche pas : immobilisation incorporelle. Le bâtiment, l’outillage, le bureau et les chaises, et le fourgon sont des biens durables qu’on peut toucher : immobilisations corporelles. Les vélos neufs sont à vendre : stocks. La facture du club (créance) et le compte Belfius (valeur disponible) vont ensemble. L’emprunt sur 7 ans est une dette à plus d’un an ; le fournisseur à 90 jours, une dette à un an au plus. Le capital n’a pas de colonne ici : on le calcule à l’étape 2, puis il se place au passif, dans les capitaux propres. Le compte de résultats est un autre document des comptes annuels." },

    { type: "input", ind: "I6", pts: 12, badge: "equil",

    { type: "qcm", ind: "I6", pts: 4,
      q: "<b>Étape 4 : vérifier.</b> Un stagiaire établit le bilan du Vélo Borain. Il trouve un total de l’actif de 177 150 € et un total du passif de 178 350 €. Que doit-il faire ?",

      expl: "Logiciel → immobilisations incorporelles. Bâtiment → constructions. Outillage → installations, machines et outillage. Bureau et chaises → mobilier. Fourgon → matériel roulant. « Stocks » et « Valeurs disponibles » sont des actifs circulants, pas des immobilisations." },

    { type: "vf", ind: "I2", pts: 2,

  ]

LEVELS.forEach(lv => { lv.maxPoints = lv.questions.reduce((s, q) => s + q.pts, 0); });
const TOTAL_XP = LEVELS.reduce((s, lv) => s + lv.maxPoints, 0);
const TOTAL_Q  = LEVELS.reduce((s, lv) => s + lv.questions.length, 0);

/* Rotation déterministe des propositions de QCM (bonne réponse rédigée en position 0). */
const DECALAGE = [2,0,3,1, 1,3,0,2, 3,1,2,0, 0,2,1,3, 2,3,0,1];
(function melangerPropositions(liste) {
  let k = 0;
  liste.forEach(q => {
    if (q.type !== "qcm") return;
    const t = DECALAGE[k++ % DECALAGE.length];
    for (let n = 0; n < t; n++) { q.options.unshift(q.options.pop()); q.correct = (q.correct + 1) % q.options.length; }
  });
})(LEVELS.flatMap(lv => lv.questions));

/* Mélange déterministe (jamais Math.random() pour l'ordre). */
function shuffled(n, seed) {
  const a = [...Array(n).keys()]; let s = seed;
  for (let i = n - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function notIdentity(a) {          /* une remise en ordre ne doit jamais commencer déjà rangée */
  if (a.every((v, i) => v === i)) a.push(a.shift());
  return a;
}

const TYPE_LABEL = { qcm: "QCM", vf: "Vrai / Faux", multi: "Sélection multiple", input: "Réponse à écrire", zones: "Classement",
  match: "Appariement", order: "Remise en ordre", trous: "Texte à trous", chasse: "Chasse aux erreurs" };

const PRED_TXT = { moitie: "environ la moitié", troisquarts: "les trois quarts", toutes: "toutes", moins: "moins de la moitié" };

}

/* ---------- Utilitaires ---------- */
function $(id) { return document.getElementById(id); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function typo(s) {
  if (s == null) return "";
  return String(s)
    .replace(/(\d) (\d{3})(?!\d)/g, "$1 $2").replace(/(\d) (\d{3})(?!\d)/g, "$1 $2")
    .replace(/ (€|%)/g, " $1")
    .replace(/« /g, "« ").replace(/ »/g, " »")
    .replace(/ ([:;!?])(?=[\s<]|$)/g, " $1");
}
function fmtN(n) {
  const neg = n < 0; n = Math.abs(Math.round(n * 100) / 100);
  let [i, f] = String(n).split(".");
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (neg ? "−" : "") + i + (f ? "," + f : "");
}
function fmtE(n) { return fmtN(n) + " €"; }
function fmtXP(n) { return fmtN(Math.round(n * 10) / 10); }
function round2(n) { return Math.round(n * 100) / 100; }
function key(l, i) { return l + "_" + i; }
function getQ(l, i) { return LEVELS[l].questions[i]; }

/* Saisie numérique : virgule ou point, espaces, points des milliers, calcul direct. */
function normNumStr(s) {
  let t = String(s == null ? "" : s).replace(/[\s  €]/g, "").replace(/[−–]/g, "-");
  if (t.includes(",")) t = t.replace(/\.(?=\d{3}(\D|$))/g, "").replace(/,/g, ".");
  else t = t.replace(/(\d)\.(?=\d{3}(\D|$))/g, "$1");
  return t;
}
function evalExpr(s) {
  const e = normNumStr(s).replace(/×/g, "*").replace(/[xX]/g, "*").replace(/÷/g, "/").replace(/:/g, "/");
  if (!/^[0-9+\-*/().]+$/.test(e) || !/[+\-*/]/.test(e.slice(1))) return null;
  try { const r = Function('"use strict";return (' + e + ")")(); return (typeof r === "number" && isFinite(r)) ? r : null; }
  catch (err) { return null; }
}
function parseNum(s) {
  const r = evalExpr(s); if (r !== null) return r;
  const t = normNumStr(s);
  return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
}
function numOk(s, ans) { const v = parseNum(s); return isFinite(v) && Math.abs(v - ans) <= 0.02; }

/* ---------- État de chaque question ---------- */
function S(l, i) {
  const k = key(l, i);
  if (!APP.qs[k]) {
    const Q = getQ(l, i), seed = l * 31 + i * 7 + 11;
    const st = { attempts: 0, done: false, status: null, earned: 0, fb: null };
    switch (Q.type) {
      case "qcm": st.wrong = []; st.last = null; break;
      case "vf": st.sel = null; break;
      case "multi": st.sel = []; st.order = shuffled(Q.options.length, seed); break;
      case "input": st.vals = Q.fields.map(() => ""); st.lock = []; break;
      case "zones": st.place = {}; st.lock = []; st.sel = null; st.intrus = [];
        st.order = shuffled(Q.items.length + (Q.distractors || []).length, seed); break;
      case "match": st.vals = Q.items.map(() => ""); st.lock = []; st.order = notIdentity(shuffled(Q.items.length, seed)); break;
      case "order": st.slots = Q.items.map(() => null); st.lock = []; st.sel = null; st.order = notIdentity(shuffled(Q.items.length + (Q.distractors || []).length, seed)); break;
      case "trous": st.fill = Q.answers.map(() => null); st.lock = []; st.sel = null;
        st.order = shuffled(Q.answers.length + (Q.distractors || []).length, seed); break;
      case "chasse": st.sel = []; st.found = {}; st.fa = 0; st.faLines = []; break;
    }
    APP.qs[k] = st;
  }
  return APP.qs[k];
}

function levelStats(l) {
  const lv = LEVELS[l]; const r = { n: lv.questions.length, first: 0, second: 0, shown: 0, earned: 0, done: 0 };
  lv.questions.forEach((q, i) => {
    const st = APP.qs[key(l, i)]; if (!st || !st.done) return;
    r.done++; r.earned += st.earned;
    if (st.status === "correct") r.first++; else if (st.status === "hint") r.second++; else r.shown++;
  });
  r.earned = round2(r.earned);
  return r;
}
function isUnlocked(l) { return l === 0 || APP.completed.includes(l - 1); }
function allDone() { return APP.completed.length === LEVELS.length; }
function gradeOf(p) { return p >= 85 ? ["A", "Excellent"] : p >= 65 ? ["B", "Très bien"] : p >= 45 ? ["C", "Satisfaisant"] : ["D", "À retravailler"]; }
function starsOf(p) { return p >= 85 ? "★★★" : p >= 65 ? "★★☆" : p >= 45 ? "★☆☆" : "☆☆☆"; }
function medalOf(p) { return p >= 90 ? "🏆" : p >= 70 ? "🥇" : p >= 50 ? "🥈" : "🥉"; }

/* ---------- Question ---------- */
function triesLabel(Q) { return Q.type === "vf" ? "1 essai" : "2 essais"; }
function renderQuestion(l, i) {
  const lv = LEVELS[l], Q = getQ(l, i), st = S(l, i);

    const s = APP.qs[key(l, k)]; const c = k === i ? "cur" : (s && s.done ? s.status : "");
    return '<span class="qdot ' + c + '" title="Question ' + (k + 1) + '"></span>';

  const last = i === lv.questions.length - 1;

  if (st.done) action = (i > 0 ? '<button class="btn ghost sm" onclick="prevQ()">← Précédente</button>' : "") +
    '<button class="btn primary" onclick="nextQ()">' + (last ? "Voir le bilan de la mission ➜" : "Question suivante ➜") + "</button>";
  else action = renderCheckBtn(Q, st);
  return `<div class="qdots">${dots}</div>
    <div class="card" id="qcard">
      <div class="row between"><span class="qtag">${TYPE_LABEL[Q.type]} — ${triesLabel(Q)} · ${Q.pts} XP</span>
        <span class="muted small">${lv.icon} Mission ${l + 1} · question ${i + 1}/${lv.questions.length}</span></div>
      <div class="qtext">${typo(Q.q)}</div>

      <div class="qnav"><div class="row"><button class="btn ghost sm" onclick="goHub()">🗺️ Parcours</button>${lv.brief.rappel ? '<button class="btn ghost sm" onclick="setScreen(\'brief\')" title="Revoir le rappel et la vidéo de la mission">📖 Rappel</button>' : ""}</div><div class="row">${action}</div></div>
    </div>`;

function renderCheckBtn(Q, st) {
  let ready = true, extra = "";
  switch (Q.type) {
    case "qcm": case "vf": return '<span class="muted small">Clique sur ta réponse.</span>';
    case "multi": ready = st.sel.length > 0; break;
    case "input": ready = st.vals.every(v => String(v).trim() !== ""); break;
    case "zones": { const n = Object.keys(st.place).length; ready = n === Q.items.length; extra = " (" + n + "/" + Q.items.length + ")"; break; }
    case "match": ready = st.vals.every(v => v !== ""); break;
    case "order": ready = st.slots.every(v => v !== null); break;
    case "trous": ready = st.fill.every(v => v !== null); break;
    case "chasse": ready = st.sel.length > 0; extra = st.sel.length ? " (" + st.sel.length + " phrase" + (st.sel.length > 1 ? "s" : "") + ")" : ""; break;
  }

function renderBody(l, i, Q, st) {

      }).join("") + "</div>" + (st.done ? '<p class="small muted" style="margin-top:8px">Les bonnes réponses oubliées sont entourées en pointillés.</p>' : "");

    case "input": return '<div class="fields">' + Q.fields.map((f, k) => {
        const lk = st.lock[k], dis = st.done || lk === "ok1" || lk === "ok2";
        const pv = evalExpr(st.vals[k]);
        return '<div class="field"><label for="in' + k + '">' + typo(f.label) + '</label><div class="inrow"><input id="in' + k + '" inputmode="decimal" autocomplete="off" class="' + (lk || "") + '" value="' + esc(st.vals[k]) + '" ' + (dis ? "disabled" : "") +
          ' oninput="inputChange(' + k + ',this.value)" onkeydown="if(event.key===\'Enter\')elemCheck(event)" placeholder="montant ou calcul"><span class="unit">€</span></div>' +
          '<div class="calc" id="calc' + k + '">' + (pv !== null && !dis ? "= " + fmtN(pv) : "") + "</div>" +

        return '<div class="mrow ' + (lk || "") + '"><span>' + typo(it.t) + '</span><select aria-label="Rubrique" ' + (dis ? "disabled" : "") + ' onchange="matchSet(' + k + ',this.value)"><option value="">— choisis —</option>' +
          Q.options.map((o, oi) => '<option value="' + oi + '" ' + (String(st.vals[k]) === String(oi) ? "selected" : "") + ">" + o + "</option>").join("") + "</select>" +

      h += '<div class="slots">' + st.slots.map((k, s) => {
        const lk = st.lock[s]; let c = "slot" + (k !== null ? " fill" : "") + (lk ? " " + lk : "") + (!st.done && st.sel !== null && !lk ? " target" : "");
        const fix = st.done && lk === "ko" ? '<span class="fix">→ à cette place : ' + typo(Q.items[s]) + "</span>" : "";
        return '<button class="' + c + '" ' + (st.done || lk === "ok1" || lk === "ok2" ? "disabled" : "") + ' onclick="orderSlot(' + s + ')"><span class="n">' + (s + 1) + "</span><span>" + (k !== null ? typo(lab(k)) : '<span class="muted small">…</span>') + fix + "</span></button>";
      }).join("") + "</div>";
      h += '<div class="ends"><span>▼ n° ' + Q.items.length + " = " + Q.ends[1] + "</span></div>";
      return h;
    }
    case "trous": {

        (bank.length ? bank.map(w => '<button class="chip ' + (st.sel === w ? "sel" : "") + '" ' + (st.done ? "disabled" : "") + ' onclick="event.stopPropagation();trouSel(' + w + ')">' + typo(words[w]) + "</button>").join("") : '<span class="small muted">Tous les mots sont placés.</span>') +

}

function renderZones(Q, st) {
  const nItems = Q.items.length, dis = Q.distractors || [];
  const labelText = k => k < nItems ? Q.items[k].t : dis[k - nItems];

    let fix = "";
    if (st.done && !isD && lk === "ko") fix = '<span class="fix">→ ' + typo(Q.zones[Q.items[k].z].name) + "</span>";
    if (st.done && isD) { c += inZone ? " ko intrus" : " intrus"; fix = '<span class="fix" style="color:' + (inZone ? "var(--error)" : "var(--text2)") + '">' + (inZone ? "✖ " : "✓ ") + typo(Q.intrus || "intrus") + "</span>"; }
    const d = st.done || lk === "ok1" || lk === "ok2" || lk === "ko";
    return '<button class="' + c + '" ' + (d ? "disabled" : "") + ' onclick="event.stopPropagation();zoneSel(' + k + ')">' + typo(labelText(k)) + fix + "</button>";

  let h = '<div class="reserve" onclick="zoneToReserve()"><div class="rt">Réserve — clique une étiquette, puis la case où elle va. (Clique une étiquette placée pour la déplacer.)</div><div class="chips">' +
    (res.length ? res.map(k => chip(k, false)).join("") : '<span class="small muted">Toutes les étiquettes sont placées.</span>') + "</div></div>";
  if (Q.layout === "bilan") {

  return h;

/* ---------- Interactions ---------- */
function cur() { const l = APP.level, i = APP.q; return { l, i, Q: getQ(l, i), st: S(l, i) }; }
function rerender() { renderScreen(); }

function qcmPick(k, ev) {
  const { l, i, Q, st } = cur(); if (st.done || st.wrong.includes(k)) return;
  const pt = evPoint(ev); st.last = k;
  if (k === Q.correct) finishQ(l, i, st.attempts === 0 ? "correct" : "hint", st.attempts === 0 ? Q.pts : Q.pts / 2, pt);
  else if (st.attempts === 0) { st.attempts = 1; st.wrong.push(k); failFirst(l, i, ""); }
  else { st.wrong.push(k); finishQ(l, i, "shown", 0, pt); }
}
function vfPick(v, ev) {
  const { l, i, Q, st } = cur(); if (st.done) return;
  st.sel = v; finishQ(l, i, v === Q.answer ? "correct" : "shown", v === Q.answer ? Q.pts : 0, evPoint(ev));
}
function multiToggle(k) {
  const { st } = cur(); if (st.done) return;
  const p = st.sel.indexOf(k); if (p >= 0) st.sel.splice(p, 1); else st.sel.push(k);
  rerender();
}
function multiCheck(ev) {
  const { l, i, Q, st } = cur(); if (st.done || !st.sel.length) return;
  const pt = evPoint(ev);
  const good = Q.options.every((o, k) => o.ok === st.sel.includes(k));
  if (good) finishQ(l, i, st.attempts === 0 ? "correct" : "hint", st.attempts === 0 ? Q.pts : Q.pts / 2, pt);
  else if (st.attempts === 0) {
    st.attempts = 1;
    const nOk = Q.options.filter(o => o.ok).length;
    failFirst(l, i, "Ta sélection n’est pas encore exacte (il y a " + nOk + " bonnes réponses). Modifie-la, puis vérifie à nouveau.");
  }
  else finishQ(l, i, "shown", 0, pt);
}
function inputChange(k, v) {
  const { Q, st } = cur(); st.vals[k] = v;
  const r = evalExpr(v), c = $("calc" + k); if (c) c.textContent = r !== null ? "= " + fmtN(r) : "";
  const b = $("checkBtn"); if (b) b.disabled = !st.vals.every(x => String(x).trim() !== "");
}
function matchSet(k, v) { const { st } = cur(); st.vals[k] = v === "" ? "" : +v; const b = $("checkBtn"); if (b) b.disabled = !st.vals.every(x => x !== ""); }

function zoneSel(k) {
  const { Q, st } = cur(); if (st.done) return;
  if (k < Q.items.length && st.lock[k]) return;
  st.sel = st.sel === k ? null : k; rerender();
}
function zonePlace(z) {
  const { st } = cur(); if (st.done || st.sel === null) return;
  st.place[st.sel] = z; st.sel = null; rerender();
}
function zoneToReserve() {
  const { st } = cur(); if (st.done || st.sel === null) return;
  delete st.place[st.sel]; st.sel = null; rerender();
}
function orderSel(k) { const { st } = cur(); if (st.done) return; st.sel = st.sel === k ? null : k; rerender(); }
function orderSlot(s) {
  const { st } = cur(); if (st.done || st.lock[s] === "ok1" || st.lock[s] === "ok2") return;
  if (st.sel !== null) {
    const from = st.slots.indexOf(st.sel); if (from >= 0) st.slots[from] = null;
    st.slots[s] = st.sel; st.sel = null;
  } else if (st.slots[s] !== null) { st.slots[s] = null; }
  rerender();
}
function orderToReserve() { const { st } = cur(); if (st.done || st.sel === null) return; const f = st.slots.indexOf(st.sel); if (f >= 0) st.slots[f] = null; st.sel = null; rerender(); }
function trouSel(w) { const { st } = cur(); if (st.done) return; st.sel = st.sel === w ? null : w; rerender(); }
function trouBlank(b) {
  const { st } = cur(); if (st.done || st.lock[b] === "ok1" || st.lock[b] === "ok2") return;
  if (st.sel !== null) { const f = st.fill.indexOf(st.sel); if (f >= 0) st.fill[f] = null; st.fill[b] = st.sel; st.sel = null; }
  else if (st.fill[b] !== null) st.fill[b] = null;
  rerender();
}
function trouToBank() { const { st } = cur(); if (st.done || st.sel === null) return; st.sel = null; rerender(); }
function chasseToggle(k) {
  const { st } = cur(); if (st.done || st.found[k]) return;
  const p = st.sel.indexOf(k); if (p >= 0) st.sel.splice(p, 1); else st.sel.push(k);
  rerender();
}

/* ---------- Correction des exercices à éléments (verrouillage progressif, règle 3.8) ---------- */
const ELEM = {
  zones: { n: Q => Q.items.length, ok: (Q, st, k) => st.place[k] === Q.items[k].z, reset: (Q, st, k) => { delete st.place[k]; } },
  match: { n: Q => Q.items.length, ok: (Q, st, k) => st.vals[k] !== "" && +st.vals[k] === Q.items[k].a, reset: (Q, st, k) => { st.vals[k] = ""; } },
  order: { n: Q => Q.items.length, ok: (Q, st, k) => st.slots[k] === k, reset: (Q, st, k) => { st.slots[k] = null; } },
  trous: { n: Q => Q.answers.length, ok: (Q, st, k) => st.fill[k] !== null && Q.answers.concat(Q.distractors || [])[st.fill[k]] === Q.answers[k], reset: (Q, st, k) => { st.fill[k] = null; } },
  input: { n: Q => Q.fields.length, ok: (Q, st, k) => numOk(st.vals[k], Q.fields[k].ans), reset: () => {} }
};
function elemReady(Q, st) {
  switch (Q.type) {
    case "zones": return Object.keys(st.place).length === Q.items.length;
    case "match": return st.vals.every(v => v !== "");
    case "order": return st.slots.every(v => v !== null);
    case "trous": return st.fill.every(v => v !== null);
    case "input": return st.vals.every(v => String(v).trim() !== "");
  }
  return false;
}
function elemCheck(ev) {
  const { l, i, Q, st } = cur(); const E = ELEM[Q.type];
  if (!E || st.done || !elemReady(Q, st)) return;
  const pt = evPoint(ev), n = E.n(Q), first = st.attempts === 0;
  let good = 0, bad = 0; const back = [];
  for (let k = 0; k < n; k++) {
    if (st.lock[k] === "ok1" || st.lock[k] === "ok2") { good++; continue; }
    if (E.ok(Q, st, k)) { st.lock[k] = first ? "ok1" : "ok2"; good++; }
    else { bad++; if (first) { E.reset(Q, st, k); back.push(k); } else st.lock[k] = "ko"; }
  }
  if (Q.type === "zones" && Q.distractors) {
    Q.distractors.forEach((_, d) => {
      const idx = Q.items.length + d;
      if (st.place[idx] !== undefined) { bad++; if (first) { delete st.place[idx]; back.push(idx); } else st.intrus.push(idx); }
    });
  }
  const v = Q.pts / n;
  const earned = () => st.lock.reduce((s, x) => s + (x === "ok1" ? v : x === "ok2" ? v / 2 : 0), 0);
  if (bad === 0) finishQ(l, i, first ? "correct" : "hint", earned(), pt);
  else if (first) {
    st.attempts = 1; st.bounce = back;
    const what = { zones: "étiquette", order: "étiquette", trous: "mot", match: "association", input: "réponse" }[Q.type];
    const pl = good > 1 ? "s" : "";
    const tail = Q.type === "input" ? "Corrige les cases qui ne sont pas encore validées."
      : Q.type === "match" ? "Les autres listes ont été remises à zéro."
      : "Les autres sont revenues dans la réserve.";
    failFirst(l, i, "✅ " + good + " " + what + pl + " juste" + pl + " sur " + n + (good ? " (verrouillée" + pl + ")" : "") + ". " + tail);
  }
  else finishQ(l, i, "shown", earned(), pt);
}
function chasseCheck(ev) {
  const { l, i, Q, st } = cur(); if (st.done || !st.sel.length) return;
  const pt = evPoint(ev), first = st.attempts === 0;
  const errs = Q.lines.map((x, k) => x.err ? k : -1).filter(k => k >= 0);
  let fa = 0;
  st.sel.forEach(k => { if (Q.lines[k].err) { if (!st.found[k]) st.found[k] = first ? "f1" : "f2"; } else { fa++; if (!st.faLines.includes(k)) st.faLines.push(k); } });
  st.fa += fa; st.sel = [];
  const foundN = errs.filter(k => st.found[k]).length, v = Q.pts / errs.length;
  const earned = () => Math.max(0, errs.reduce((s, k) => s + (st.found[k] === "f1" ? v : st.found[k] === "f2" ? v / 2 : 0), 0) - st.fa);
  if (foundN === errs.length) finishQ(l, i, first ? "correct" : "hint", earned(), pt);
  else if (first) {
    st.attempts = 1;
    failFirst(l, i, "🔎 " + foundN + " erreur" + (foundN > 1 ? "s" : "") + " trouvée" + (foundN > 1 ? "s" : "") + " sur " + errs.length + (foundN ? " (en vert)" : "") + "." +
      (fa ? " " + fa + " fausse" + (fa > 1 ? "s" : "") + " alerte" + (fa > 1 ? "s" : "") + " : −" + fa + " XP." : "") + " Cherche les autres !");
  }
  else finishQ(l, i, "shown", earned(), pt);
}

/* ---------- Fin de question, feedback, effets ---------- */
function failFirst(l, i, msg) {
  const Q = getQ(l, i), st = S(l, i);
  APP.streak = 0;
  st.fb = { cls: "hint", title: "🤔 Pas encore… Voici un indice", html: (msg ? "<p>" + typo(msg) + "</p>" : "") + "<p>💡 " + typo(Q.hint || "") + "</p><p class='small muted'>2<sup>e</sup> essai : une bonne réponse rapporte la moitié des points.</p>" };
  sfx("bad"); save(); rerender();
  const c = $("qcard"); if (c) { c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
}
function finishQ(l, i, status, earned, pt) {
  const Q = getQ(l, i), st = S(l, i);
  st.done = true; st.status = status; st.earned = round2(earned);
  APP.score = round2(APP.score + st.earned);
  const head = { correct: "✅ Exact, du premier coup !", hint: "🔄 Corrigé au 2<sup>e</sup> essai", shown: "👁 Voici la correction" }[status];
  const cls = { correct: "ok", hint: "mid", shown: "ko" }[status];
  let extra = "";
  if (Q.type === "chasse" && st.fa) extra = "<p class='small'>Fausses alertes : " + st.fa + " (−" + st.fa + " XP).</p>";
  st.fb = { cls, title: head + " <span class='small muted'>+" + fmtXP(st.earned) + " XP</span>", html: "<p>" + typo(Q.expl) + "</p>" + extra };
  if (status === "correct") {
    APP.streak++; APP.bestStreak = Math.max(APP.bestStreak, APP.streak);
    sfx("ok");
    if (APP.streak >= 5) award("feu");
    if (APP.streak >= 10) award("inarr");
    if (Q.badge && (Q.type !== "chasse" || st.fa === 0)) award(Q.badge);
  } else { APP.streak = 0; if (st.earned > 0) sfx("mid"); }
  checkRank();
  checkLevelDone(l);
  save();
  rerender();
  if (st.earned > 0) { particles(pt.x, pt.y, status === "correct"); xpFloat(pt.x, pt.y, "+" + fmtXP(st.earned) + " XP"); }
  else { const c = $("qcard"); if (c) { c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); } }
  if (status === "correct" && APP.streak >= 3) comboFlash(APP.streak);
}
function evPoint(ev) {
  if (ev && ev.clientX) return { x: ev.clientX, y: ev.clientY };
  const t = ev && ev.target && ev.target.getBoundingClientRect ? ev.target.getBoundingClientRect() : null;
  return t ? { x: t.left + t.width / 2, y: t.top + t.height / 2 } : { x: innerWidth / 2, y: innerHeight / 2 };
}
function predCat(first, n) { const r = first / n; return r === 1 ? "toutes" : r >= 0.625 ? "troisquarts" : r >= 0.375 ? "moitie" : "moins"; }
function checkLevelDone(l) {
  if (APP.completed.includes(l)) return;
  const lv = LEVELS[l];
  if (!lv.questions.every((q, i) => APP.qs[key(l, i)] && APP.qs[key(l, i)].done)) return;
  APP.completed.push(l);
  const s = levelStats(l);
  if (APP.predictions[l] && APP.predictions[l] === predCat(s.first, s.n)) award("lucide");
  if (l === 0) award("m1");
  if (allDone()) { award("boucle"); if (overall().pct >= 85) award("expert"); }
  sfx("level");
  completeExercise(l);
}
function overall() {
  let n = 0, first = 0, second = 0, shown = 0, earned = 0;
  LEVELS.forEach((lv, l) => { const s = levelStats(l); n += s.n; first += s.first; second += s.second; shown += s.shown; earned += s.earned; });
  return { n, first, second, shown, earned: round2(earned), pct: n ? Math.round(first / n * 100) : 0 };
}

/* Sons Web Audio — coupés par défaut */
let AC = null;
function tone(freq, start, dur, type, vol) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + start;
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function sfx(kind) {
  if (!APP.sound) return;
  if (kind === "ok") { tone(660, 0, .12); tone(990, .1, .16); }
  else if (kind === "mid") { tone(587, 0, .14); }
  else if (kind === "bad") { tone(220, 0, .22, "triangle", .12); }
  else if (kind === "badge") { tone(784, 0, .12); tone(988, .1, .12); tone(1319, .2, .22); }
  else if (kind === "level") { [523, 659, 784, 1047].forEach((f, k) => tone(f, k * .11, .18)); }
  else if (kind === "rank") { [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, k * .1, .22, "triangle")); }
}
function toggleSound() { APP.sound = !APP.sound; updateHUD(); if (APP.sound) sfx("ok"); }

/* ---------- Bilan final par critères et indicateurs (§4.11) ---------- */
function bilanIndicateurs() {
  const acc = {};
  LEVELS.forEach((lv, l) => lv.questions.forEach((q, i) => {
    const a = acc[q.ind] || (acc[q.ind] = { pts: 0, max: 0 });
    a.max += q.pts; a.pts += (APP.qs[key(l, i)] && APP.qs[key(l, i)].earned) || 0;
  }));
  const statut = r => r >= 0.8 ? "atteint" : r >= 0.5 ? "encours" : "nonatteint";
  return CRITERES.map(c => {
    const inds = c.indicateurs.map(ind => { const a = acc[ind.id] || { pts: 0, max: 0 }; const r = a.max ? a.pts / a.max : 0; return Object.assign({}, ind, { ratio: r, statut: statut(r) }); });
    const tot = c.indicateurs.reduce((t, ind) => { const a = acc[ind.id] || { pts: 0, max: 0 }; return { pts: t.pts + a.pts, max: t.max + a.max }; }, { pts: 0, max: 0 });
    const r = tot.max ? tot.pts / tot.max : 0;
    return { id: c.id, nom: c.nom, ratio: r, statut: statut(r), indicateurs: inds };
  });
}

/* ============================================================
   TRACKING — Configuration (SPEC_Tracking_Eleves v5)
   ============================================================ */
const TRACKING = {
  appName: "Le patrimoine — Le bilan simplifié",   // nom exact et constant
  totalNiveaux: LEVELS.length,                     // 6 missions
  sessionId: null,
  scriptUrl: "https://script.google.com/macros/s/AKfycbx9bRMVuHU2mgFLii1KcQXD3LdZahnDH1rf1cWv9RuDvQAt0l3VtLtxzmbH7MtpJWRjfA/exec"
};

/* ---------- Modal email (affiché à chaque lancement) ---------- */
function showEmailModal() {
  const overlay = document.getElementById("emailOverlay");
  overlay.style.display = "flex";
  const input = document.getElementById("emailInput");
  const saved = lsGet("student_email");
  if (saved) input.value = saved;
  input.focus();
  document.getElementById("emailError").textContent = "";
}

function validateEmail() {
  const input = document.getElementById("emailInput");
  const btn = document.getElementById("emailBtn");
  const errDiv = document.getElementById("emailError");
  const email = input.value.trim().toLowerCase();

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errDiv.textContent = "⚠️ Entre une adresse email valide.";
    input.style.borderColor = "#ff4060";
    return;
  }
  btn.textContent = "⏳ Vérification…";
  btn.disabled = true;
  errDiv.textContent = "";
  input.style.borderColor = "";

  const cbName = "_emailCb_" + Date.now();
  const timeout = setTimeout(() => {
    delete window[cbName];
    const s = document.getElementById(cbName); if (s) s.remove();
    errDiv.textContent = "⚠️ Connexion impossible. Vérifie ta connexion internet.";
    btn.textContent = "✅ Vérifier et commencer";
    btn.disabled = false;
  }, 10000);

  window[cbName] = function (resp) {
    clearTimeout(timeout);
    delete window[cbName];
    const s = document.getElementById(cbName); if (s) s.remove();
    btn.textContent = "✅ Vérifier et commencer";
    btn.disabled = false;
    if (resp && resp.found) {
      const oldEmail = lsGet("student_email");
      lsSet("student_email", email);
      lsSet("student_classe", resp.classe || "");
      APP.email = email;
      APP.classe = resp.classe || "";
      if (oldEmail && oldEmail !== email) resetProgression();
      TRACKING.sessionId = new Date().toISOString();
      document.getElementById("emailOverlay").style.display = "none";
      startGlobalTimer();
      onEmailValidated();
    } else {
      errDiv.textContent = "⚠️ Cette adresse email n'est pas enregistrée. Vérifie l'orthographe ou demande à ton professeur de t'ajouter à la liste.";
      input.style.borderColor = "#ff4060";
    }
  };

  const s = document.createElement("script");
  s.id = cbName;
  s.src = `${TRACKING.scriptUrl}?action=check_email&email=${encodeURIComponent(email)}&callback=${cbName}`;
  s.onerror = () => {
    clearTimeout(timeout);
    delete window[cbName];
    s.remove();
    errDiv.textContent = "⚠️ Erreur de connexion au serveur.";
    btn.textContent = "✅ Vérifier et commencer";
    btn.disabled = false;
  };
  document.body.appendChild(s);
}

/* Nouvel email sur le même appareil : on repart de zéro en mémoire
   (la partie sauvegardée de ce nouvel élève lui sera proposée ensuite). */
function resetProgression() {
  vidStop();
  Object.assign(APP, freshState());
  console.log("[TRACKING] Progression réinitialisée (nouvel email)");
}

/* ---------- Chronomètre global visible ---------- */
function startGlobalTimer() {
  APP.globalTimerStart = Date.now();
  const el = document.getElementById("globalTimer");
  if (el) el.style.display = "inline";
  if (APP.globalTimerInterval) clearInterval(APP.globalTimerInterval);
  APP.globalTimerInterval = setInterval(updateTimerDisplay, 1000);
  updateTimerDisplay();
}
function updateTimerDisplay() {
  const el = document.getElementById("globalTimer");
  if (!el || !APP.globalTimerStart) return;
  const elapsed = Math.floor((Date.now() - APP.globalTimerStart) / 1000);
  el.textContent = "⏱️ " + String(Math.floor(elapsed / 60)).padStart(2, "0") + ":" + String(elapsed % 60).padStart(2, "0");
}

/* ---------- Chronomètre par mission (invisible) ----------
   Démarre à l'ouverture du briefing (le temps envoyé inclut la lecture du rappel et la vidéo),
   s'arrête quand la dernière question de la mission est résolue. */
function startLevelTimer(l) {
  if (APP.completedExercises.includes(l)) return;
  if (!APP.levelStart[l]) APP.levelStart[l] = Date.now();
}
function formatTime(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m > 0 ? m + "m " + String(s).padStart(2, "0") + "s" : s + "s"; }

/* Appelée une seule fois par mission (anti-doublon) */
function completeExercise(l) {
  if (APP.completedExercises.includes(l)) return;
  APP.completedExercises.push(l);
  const lv = LEVELS[l], s = levelStats(l);
  const temps = APP.levelStart[l] ? Math.round((Date.now() - APP.levelStart[l]) / 1000) : 0;
  APP.exerciseTimes[l] = temps;
  APP.exerciseScores[l] = s.earned;
  sendResult("Mission " + (l + 1) + " — " + lv.title, s.earned, lv.maxPoints, temps);
}

/* ---------- Envoi des résultats ---------- */
function sendResult(niveau, points, pointsMax, temps) {
  if (!APP.email) return;
  const payload = {
    email: APP.email,
    classe: APP.classe,
    app: TRACKING.appName,
    niveau: niveau,
    points: points,
    pointsMax: pointsMax,
    temps: temps,
    totalNiveaux: TRACKING.totalNiveaux,
    sessionId: TRACKING.sessionId
  };
  console.log("[TRACKING] Envoi:", payload);
  fetch(TRACKING.scriptUrl, {
    method: "POST", mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  }).catch(err => console.warn("[TRACKING] Erreur:", err));
}

/* ---------- Classements ---------- */
let currentLBTab = "app";
function openLB(tab) {
  document.getElementById("lbOverlay").style.display = "block";
  switchLBTab(tab || "app");
}
function closeLB() { document.getElementById("lbOverlay").style.display = "none"; }
function switchLBTab(tab) {
  currentLBTab = tab;
  const btnApp = document.getElementById("lbTabApp");
  const btnGlobal = document.getElementById("lbTabGlobal");
  const cl = APP.classe ? " (" + APP.classe + ")" : "";
  document.getElementById("lbTitle").textContent = tab === "app" ? "🏆 Classement — " + TRACKING.appName + cl : "🌍 Classement général" + cl;
  if (tab === "app") {
    btnApp.style.background = "var(--accent,#22d68a)"; btnApp.style.color = "#0f1117";
    btnGlobal.style.background = "transparent"; btnGlobal.style.color = "var(--orange,#ff8a3d)";
  } else {
    btnGlobal.style.background = "var(--orange,#ff8a3d)"; btnGlobal.style.color = "#0f1117";
    btnApp.style.background = "transparent"; btnApp.style.color = "var(--accent,#22d68a)";
  }
  fetchLeaderboard(tab);
}
function fetchLeaderboard(tab) {
  const content = document.getElementById("lbContent");
  content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2,#999);">⏳ Chargement…</div>';
  const action = tab === "app" ? "leaderboard_app" : "leaderboard_global";
  const cbName = "_lbCb_" + Date.now();
  const timeout = setTimeout(() => {
    delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove();
    content.innerHTML = '<div style="text-align:center;padding:40px;"><div style="color:#ff4060;margin-bottom:12px;">⚠️ Connexion impossible</div><button onclick="fetchLeaderboard(\'' + tab + '\')" style="padding:8px 20px;border-radius:8px;border:1px solid var(--border,#333);background:var(--bg3,#111);color:var(--text,#eee);cursor:pointer;font-family:inherit;">Réessayer</button></div>';
  }, 10000);
  window[cbName] = function (resp) {
    clearTimeout(timeout); delete window[cbName];
    const s = document.getElementById(cbName); if (s) s.remove();
    const lbData = resp && (resp.leaderboard || resp.data);
    if (!lbData || lbData.length === 0) {
      content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2,#999);">🏁 Aucun résultat pour le moment</div>';
      return;
    }
    renderLeaderboard(lbData, tab);
  };
  let url = `${TRACKING.scriptUrl}?action=${action}&callback=${cbName}&mode=last`;
  if (tab === "app") url += `&app=${encodeURIComponent(TRACKING.appName)}`;
  if (APP.classe) url += `&classe=${encodeURIComponent(APP.classe)}`;
  const s = document.createElement("script");
  s.id = cbName; s.src = url;
  s.onerror = () => { clearTimeout(timeout); delete window[cbName]; s.remove(); content.innerHTML = '<div style="text-align:center;padding:40px;color:#ff4060;">⚠️ Erreur de connexion</div>'; };
  document.body.appendChild(s);
}
function renderLeaderboard(data, tab) {
  const content = document.getElementById("lbContent");
  const myEmail = (APP.email || "").toLowerCase();
  if (tab === "global" && data.length > 0) {
    data = data.slice().sort((a, b) => {
      const pctA = a.pct != null ? a.pct : (a.pourcentage || 0);
      const pctB = b.pct != null ? b.pct : (b.pourcentage || 0);
      if (pctB !== pctA) return pctB - pctA;
      return (a.totalTemps || a.totalTime || 0) - (b.totalTemps || b.totalTime || 0);
    });
    data.forEach((entry, i) => { entry.rang = i + 1; });
  }
  const me = data.find(r => (r.email || "").toLowerCase() === myEmail);
  let html = "";
  if (me) {
    const pct = me.pct != null ? me.pct : (me.pourcentage != null ? me.pourcentage : 0);
    const count = tab === "app" ? (me.niveauxCompletes || me.niveaux || 0) : (me.appsCompletes || me.apps || 0);
    const total = tab === "app" ? (me.totalNiveaux || 0) : (me.totalPossibleNiveaux || 0);
    const label = tab === "app" ? "niveaux" : "apps";
    const prog = total > 0 ? count + "/" + total + " " + label : count + " " + label;
    html += `<div style="background:rgba(34,214,138,0.08);border:1px solid rgba(34,214,138,0.3);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;justify-content:space-around;text-align:center;gap:6px;flex-wrap:wrap;">
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--accent,#22d68a);">#${me.rang}</div><div style="font-size:0.7rem;color:var(--text2,#999);">RANG</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;">${me.totalPoints}</div><div style="font-size:0.7rem;color:var(--text2,#999);">POINTS</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:${pct >= 80 ? "#22d68a" : pct >= 50 ? "#ff8a3d" : "#ff4060"};">${pct}%</div><div style="font-size:0.7rem;color:var(--text2,#999);">RÉUSSITE</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--text2,#999);">${prog}</div><div style="font-size:0.7rem;color:var(--text2,#999);">PROGRESSION</div></div>
    </div>`;
  }
  const medals = ["🥇", "🥈", "🥉"];
  html += '<table style="width:100%;border-collapse:collapse;font-size:0.85rem;"><tr style="border-bottom:1px solid var(--border,#333);"><th style="text-align:left;padding:8px 4px;color:var(--text2,#999);font-size:0.72rem;">#</th><th style="text-align:left;padding:8px 4px;color:var(--text2,#999);font-size:0.72rem;">Élève</th><th style="text-align:right;padding:8px 4px;color:var(--text2,#999);font-size:0.72rem;">Pts</th><th style="text-align:right;padding:8px 4px;color:var(--text2,#999);font-size:0.72rem;">%</th><th style="text-align:right;padding:8px 4px;color:var(--text2,#999);font-size:0.72rem;">Temps</th></tr>';
  data.forEach(row => {
    const r = row.rang || 0;
    const name = String(row.email || "").split("@")[0].split(/[._-]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
    const pct = row.pct != null ? row.pct : (row.pourcentage != null ? row.pourcentage : 0);
    const temps = row.totalTemps || row.totalTime || 0;
    const isMe = (row.email || "").toLowerCase() === myEmail;
    const pctC = pct >= 80 ? "#22d68a" : pct >= 50 ? "#ff8a3d" : "#ff4060";
    let tStr = "—"; if (temps > 0) { const m = Math.floor(temps / 60), s = temps % 60; tStr = m > 0 ? m + "m" + String(s).padStart(2, "0") + "s" : s + "s"; }
    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.03);background:${isMe ? "rgba(34,214,138,0.08)" : "transparent"};"><td style="padding:8px 4px;font-weight:700;">${r >= 1 && r <= 3 ? medals[r - 1] : r}</td><td style="padding:8px 4px;${isMe ? "font-weight:800;color:var(--accent,#22d68a);" : ""}">${esc(name)}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:var(--accent,#22d68a);">${row.totalPoints}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:${pctC};">${pct}%</td><td style="padding:8px 4px;text-align:right;color:var(--text2,#999);font-family:monospace;font-size:0.78rem;">${tStr}</td></tr>`;
  });
  html += "</table>";
  content.innerHTML = html;
}
